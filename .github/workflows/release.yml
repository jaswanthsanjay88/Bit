name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (optional for manual trigger)'
        required: false
        default: 'Manual Release Build'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout exact tagged commit with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Cache NDK build outputs (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            llama-kt/.cxx
            app/.cxx
            file_ops/.cxx
          key: ${{ runner.os }}-ndk-cxx-${{ hashFiles('**/CMakeLists.txt', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ndk-cxx-

      - name: Install exact pinned NDK & CMake
        run: |
          SDKMANAGER=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found in $ANDROID_HOME"; exit 1; }
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            python3 -c "
          import os, base64, re
          raw = os.environ['RELEASE_KEYSTORE_BASE64']
          raw = re.sub(r'-----BEGIN [^-]+-----', '', raw)
          raw = re.sub(r'-----END [^-]+-----', '', raw)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw).replace('-', '+').replace('_', '/')
          pad = len(clean) % 4
          if pad: clean += '=' * (4 - pad)
          with open('release-key.jks', 'wb') as f: f.write(base64.b64decode(clean))
          "
            test -s release-key.jks || { echo "::error::Keystore decode produced empty file"; exit 1; }
            echo "✅ Keystore restored ($(wc -c < release-key.jks) bytes)"
          else
            echo "⚠️ RELEASE_KEYSTORE_BASE64 not set; app/build.gradle.kts will fallback to debug signing"
          fi

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4

      - name: Assemble release APKs
        run: |
          ./gradlew assembleRelease \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dandroid.r8.maxWorkers=4

      - name: Stage Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          ls -la release-artifacts/

      - name: Verify signing
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          for apk in release-artifacts/*.apk; do
            echo "Verifying $apk..."
            $BUILD_TOOLS_DIR/apksigner verify --print-certs "$apk" || true
          done

      - name: Generate Release Summary
        if: always()
        run: |
          echo "### 🚀 BIT Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -d release-artifacts ] && [ "$(ls -A release-artifacts 2>/dev/null)" ]; then
            echo "#### 📦 Built Artifacts:" >> $GITHUB_STEP_SUMMARY
            for f in release-artifacts/*; do
              echo "- \`$(basename "$f")\` ($(ls -lh "$f" | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ No release artifacts produced. Check failed step logs above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts/*.apk
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          generate_release_notes: true
