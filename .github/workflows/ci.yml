name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Cache NDK build outputs (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            llama-kt/.cxx
            app/.cxx
            file_ops/.cxx
          key: ${{ runner.os }}-ndk-cxx-${{ hashFiles('**/CMakeLists.txt', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ndk-cxx-

      - name: Install exact pinned NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Cache NDK build outputs (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            llama-kt/.cxx
            app/.cxx
            file_ops/.cxx
          key: ${{ runner.os }}-ndk-cxx-${{ hashFiles('**/CMakeLists.txt', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ndk-cxx-

      - name: Install exact pinned NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
