name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'
      - 'fdroid/**'
      - 'site/**'
      - 'site-react/**'
      - 'web-ui/**'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'
      - 'fdroid/**'
      - 'site/**'
      - 'site-react/**'
      - 'web-ui/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Verify Production Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Cache NDK build outputs (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            llama-kt/.cxx
            app/.cxx
            file_ops/.cxx
            workspace/.cxx
          key: ${{ runner.os }}-ndk-cxx-${{ hashFiles('**/CMakeLists.txt', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ndk-cxx-

      - name: Install exact pinned NDK & CMake
        run: |
          SDKMANAGER=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found in $ANDROID_HOME"; exit 1; }
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            python3 -c "
          import os, base64, re
          raw = os.environ['RELEASE_KEYSTORE_BASE64']
          raw = re.sub(r'-----BEGIN [^-]+-----', '', raw)
          raw = re.sub(r'-----END [^-]+-----', '', raw)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw).replace('-', '+').replace('_', '/')
          pad = len(clean) % 4
          if pad: clean += '=' * (4 - pad)
          with open('release-key.jks', 'wb') as f: f.write(base64.b64decode(clean))
          "
            test -s release-key.jks || { echo "::error::Keystore decode produced empty file"; exit 1; }
            echo "✅ Keystore restored ($(wc -c < release-key.jks) bytes)"
          else
            echo "⚠️ RELEASE_KEYSTORE_BASE64 not set; app/build.gradle.kts will fallback to debug signing for release build"
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Assemble Production Release APKs
        run: |
          ./gradlew assembleRelease \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dandroid.r8.maxWorkers=4

      - name: Stage Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          ls -la release-artifacts/

      - name: Verify signing
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          for apk in release-artifacts/*.apk; do
            echo "Verifying $apk..."
            $BUILD_TOOLS_DIR/apksigner verify --print-certs "$apk" || true
          done

      - name: Upload Production Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: bit-release-apks
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Generate Build Summary
        if: always()
        run: |
          echo "### 🚀 BIT Production Release CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -d release-artifacts ] && [ "$(ls -A release-artifacts 2>/dev/null)" ]; then
            echo "#### 📦 Production Release Artifacts Built & Verified:" >> $GITHUB_STEP_SUMMARY
            for f in release-artifacts/*; do
              echo "- \`$(basename "$f")\` ($(ls -lh "$f" | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ No release artifacts produced. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi
